  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --color-bg: #0e0c14;
      --color-text: #e4e4e7;
      --color-muted: #a1a1aa;
      --color-primary: hsl(258deg 90% 66%);
      --color-primary-glow: hsl(258deg 90% 66% / 0.4);
      --color-neon: hsl(275deg 100% 70% / 0.8);
      --color-neon-deep: hsl(268deg 68% 53%);
      --color-pink: hsl(325deg 85% 72%);
      --color-indigo: hsl(235deg 85% 72%);
    }

    ::selection { background: var(--color-primary-glow); color: var(--color-text); }

    body {
      font-family: system-ui, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      touch-action: none;
    }


    .lava-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    .lava-canvas:active { cursor: grabbing; }

    .container {
      text-align: center;
      padding: 2rem;
      animation: fadeIn 0.6s ease-out;
      position: relative;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
    }

    .avatar {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      box-shadow: 0 0 0 4px var(--color-bg), 0 0 0 8px var(--color-primary-glow), 0 0 24px var(--color-primary-glow);
      transition: box-shadow 0.3s ease;
    }
    .avatar:hover { box-shadow: 0 0 0 4px var(--color-bg), 0 0 0 8px var(--color-primary), 0 0 40px var(--color-primary-glow), 0 0 80px var(--color-primary-glow); }

    h1 {
      margin-top: 1.25rem;
      font-size: 2.5rem;
      letter-spacing: -0.02em;
      text-shadow: -1px 0 var(--color-pink), 1px 0 var(--color-indigo), 0 0 18px var(--color-primary-glow);
    }

    .bio {
      margin-top: 0.4rem;
      font-size: 1.1rem;
      color: var(--color-muted);
    }


    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background: var(--color-primary);
      margin-left: 1px;
      vertical-align: text-bottom;
      animation: blink 0.6s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    nav {
      margin-top: 1.75rem;
      display: flex;
      gap: 1.25rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    nav + nav { margin-top: 1rem; }

    nav a {
      display: inline-flex;
      color: var(--color-muted);
      transition: color 0.2s ease, transform 0.2s ease;
    }
    nav a:hover, nav a:focus-visible {
      color: var(--color-primary);
      transform: translateY(-2px);
    }
    nav a:focus-visible { outline: none; }

    nav svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
    }

    .bubble-hint {
      font-style: italic;
      font-size: 1.14rem;
      position: fixed;
      bottom: 1.25rem;
      inset-inline: 0;
      text-align: center;
      color: #f0e6ff;
      text-shadow: 0 0 20px var(--color-neon), 0 0 40px var(--color-neon-deep), 0 0 80px var(--color-primary-glow);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
      will-change: opacity;
    }
    .bubble-hint.visible { opacity: 0.85; }
  </style>

  <script>
    const pick = arr => arr[Math.floor(Math.random() * arr.length)];
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    // --- Typewriter ---
    (async () => {
      const words = [
        "Debbie Marks impression", "domain expansion", "search history",
        "equivalent exchange", "Terraria mods", "spaghetti code", "Boston accent",
        "final form", "stone world", "lore", "Gear 5", "Hunter license", "isekai arc",
        "evolutionary couplings", "MSAs", "crystal structures", "commits", "unread papers",
        "snobby reviews", "cool stuff", "socials", "sludge", "slop", "drip"
      ];
      const el = document.getElementById("typed");
      let queue = [];
      for (;;) {
        if (!queue.length) queue = words.map(w => [Math.random(), w]).sort((a, b) => a[0] - b[0]).map(p => p[1]);
        const word = queue.pop();
        for (let i = 1; i <= word.length; i++) { el.textContent = word.slice(0, i); await sleep(55); }
        await sleep(1500);
        for (let i = word.length - 1; i >= 0; i--) { el.textContent = word.slice(0, i); await sleep(35); }
        await sleep(300);
      }
    })();

    // --- Interactive lava lamp (WebGL metaball shader) + Easter eggs ---
    (() => {
      const canvas = document.getElementById("lava");
      const gl = canvas.getContext("webgl", { alpha: false, antialias: false, depth: false, desynchronized: true });
      // Debug: ?fps shows a frame-time readout, ?scale=N overrides the render resolution
      const debug = new URLSearchParams(location.search);
      if (!gl) { console.warn("WebGL not available — lava lamp disabled"); return; }
      const hintEl = document.getElementById("bubble-hint");

      // --- Constants (physics is tuned per 60 Hz tick) ---
      const STEP = 1000 / 60;
      const MAX_SLOTS = 64;
      const SPEED_CLAMP = 3.5;
      const SPEED_CLAMP_FLYING = 14;
      const DAMPING = 0.984;

      const IDLE_UNIFORM_R = 25;
      const IDLE_RADIUS_LERP = 0.03;
      const IDLE_NUDGE_FRAMES = [900, 1500, 2400];
      const IDLE_DANCE_START = 3000;
      const IDLE_SHAPE_DURATION = 360;
      const IDLE_SHAPE_BLEND = 120;

      const CURSOR_R_REST = 52;
      const CURSOR_R_CLICK = 90;
      const CURSOR_SPRING_K = 0.12;
      const CURSOR_SPRING_DAMP = 0.55;
      const CURSOR_TRAIL_LAG = 0.35;

      const WALL_SPRING = 0.15;
      const WALL_DAMP = 0.92;

      const POP_RADIUS = 250;
      const POP_BONUS_COUNT = 4;
      const REASSEMBLE_RADIUS = 150;
      const REASSEMBLE_DELAY = 180;

      const BLOB_FADE_RATE = 0.95;
      const BLOB_FADE_MIN = 2;
      const BLOB_FADE_RATE_GOHOME = 0.97;

      const MOUSE_SPEED_DECAY = 0.9;
      const MOUSE_PUSH_RANGE = 400;
      const MOUSE_REPEL_RANGE = 900;
      const MOUSE_ATTRACT_RANGE = 600;
      const MOUSE_PROXIMITY_DAMP = 200;

      const HINT_FADE_MS = 250;
      const HINT_DISPLAY_MS = 2500;

      const smoothstep01 = x => { const t = Math.min(Math.max(x, 0), 1); return t * t * (3 - 2 * t); };

      // --- State ---
      let W, H, dpr;

      // Input
      let mx = null, my = null;
      let mouseSpeed = 0;
      let mouseDown = false;
      let isTouch = false;
      let cursorRadius = CURSOR_R_REST;
      let cursorRadiusVel = 0;
      // Cursor blob + its lagging trail, sampled each physics step (px/py = previous step, for interpolation)
      const cur = { x: 0, y: 0, px: 0, py: 0 }, trail = { x: 0, y: 0, px: 0, py: 0 };
      let cursorLive = false;

      // Animation time (in 60 Hz ticks)
      let time = 0;
      let lastInteractionTime = 0;

      // Pop / reassemble
      let hasPopped = false;
      let popFrame = 0;
      let hasReassembled = false;
      let reassembleHintShown = false;

      // Idle
      let idleMode = false;
      let idleShapeIndex = 0;
      let prevIdleShapeIndex = 0;
      let idleShapeSwitchTime = 0;
      let idleDanceStart = 0;
      let idleRadiusFactor = 1.0;
      let idleHinted = false;

      // Shake
      let lastShakeTime = 0;

      // Idle formation shapes (normalized offsets from center, y-down screen coords)
      const shapes = [
        // Heart
        [[0, -0.08], [-0.15, -0.22], [-0.27, -0.08], [-0.17, 0.1], [0, 0.27], [0.17, 0.1], [0.27, -0.08], [0.15, -0.22]],
        // Letter M
        [[-0.25, 0.2], [-0.25, -0.2], [-0.1, 0.02], [0, -0.12], [0.1, 0.02], [0.25, -0.2], [0.25, 0.2], [0, 0.2]],
        // Smiley
        [[-0.1, -0.12], [0.1, -0.12], [-0.2, 0.05], [-0.1, 0.16], [0, 0.19], [0.1, 0.16], [0.2, 0.05], [0, -0.25]],
      ];

      // --- Hints: priority queue (0 = top, 1 = high, 2 = normal, 3 = low; only shown when nothing else is) ---
      let hintQueue = [], hintCur = null, hovering = false, hintTimer = 0;

      function setHint(text) { hintEl.textContent = text; hintEl.classList.add("visible"); }

      function hideHint() {
        clearTimeout(hintTimer);
        hintEl.classList.remove("visible");
        if (hintCur) hintCur.pri = 99; // fading out: anything may replace it
        hintTimer = setTimeout(() => { hintCur = null; nextHint(); }, HINT_FADE_MS);
      }

      function nextHint() {
        if (hintCur || hovering || !hintQueue.length) return;

        setHint(hintCur.text);
        hintTimer = setTimeout(hideHint, HINT_DISPLAY_MS);
      }

      function showHint(text, pri = 2) {
        if (pri === 3 && (hintCur || hintQueue.length)) return;
        if (pri === 0) hintQueue = hintQueue.filter(h => h.pri === 0);
        hintQueue.push({ text, pri });
        hintQueue.sort((a, b) => a.pri - b.pri);
        if (!hintCur) nextHint();
        else if (hintCur.pri !== 99 && hintQueue[0].pri <= hintCur.pri) hideHint();
      }

      // Link hover hints pre-empt the queue; an interrupted hint resumes afterwards
      function hoverHint(text) {
        clearTimeout(hintTimer);
        if (hintCur && hintCur.pri !== 99) hintQueue.unshift(hintCur);
        hintCur = null;
        hovering = true;
        const showing = parseFloat(getComputedStyle(hintEl).opacity) > 0.01;
        hintEl.classList.remove("visible");
        hintTimer = setTimeout(() => setHint(text), showing ? HINT_FADE_MS : 0);
      }
      function unhoverHint() { hovering = false; hideHint(); }

      document.querySelectorAll("[data-hint]").forEach(a => {
        const enter = () => hoverHint(a.dataset.hint);
        a.addEventListener("mouseenter", enter);
        a.addEventListener("focus", enter);
        a.addEventListener("mouseleave", unhoverHint);
        a.addEventListener("blur", unhoverHint);
      });

      // --- Input (pointer events cover mouse, touch and pen) ---
      const welcomeBacks = ["welcome back!", "oh hi!", "you're back!", "missed you :)", "whoa! didn't see you there", "act natural"];
      function recordInteraction() {
        lastInteractionTime = time;
        if (idleHinted) { idleHinted = false; showHint(pick(welcomeBacks), 1); }
        idleMode = false;
      }

      function clearPointer() { mx = my = null; mouseSpeed = 0; }

      addEventListener("pointermove", e => {
        if (!e.isPrimary) return;
        mx = e.clientX; my = e.clientY;
        recordInteraction();
      });
      addEventListener("pointerdown", e => {
        if (!e.isPrimary) return;
        isTouch = e.pointerType === "touch";
        mouseDown = true;
        mx = e.clientX; my = e.clientY;
        recordInteraction();
      });
      const release = () => {
        mouseDown = false;
        if (isTouch) clearPointer();
      };
      addEventListener("pointerup", release);
      addEventListener("pointercancel", release);
      document.documentElement.addEventListener("mouseleave", () => { mouseDown = false; clearPointer(); });
      addEventListener("keydown", recordInteraction);

      // --- Shake to scatter (mobile) ---
      function handleMotion(e) {
        const acc = e.acceleration || e.accelerationIncludingGravity;
        if (!acc || acc.x === null) return;
        if (Math.hypot(acc.x, acc.y, acc.z) > (e.acceleration ? 15 : 25) && Date.now() - lastShakeTime > 2000) {
          lastShakeTime = Date.now();
          recordInteraction();
          for (const b of blobs) {
            const angle = Math.random() * Math.PI * 2, speed = 5 + Math.random() * 3;
            b.vx = Math.cos(angle) * speed;
            b.vy = Math.sin(angle) * speed;
          }
          showHint("earthquake!");
        }
      }
      if (typeof DeviceMotionEvent !== "undefined") {
        if (typeof DeviceMotionEvent.requestPermission === "function") {
          // iOS 13+ needs permission from a user gesture
          addEventListener("touchstart", () => {
            DeviceMotionEvent.requestPermission().then(s => s === "granted" && addEventListener("devicemotion", handleMotion)).catch(() => {});
          }, { once: true, passive: true });
        } else addEventListener("devicemotion", handleMotion);
      }

      // --- Renderer ---
      // The metaball field (the per-blob loop) is smooth, so it's computed at half resolution into a
      // half-float texture; the neon shading then runs at full resolution from one bilinear read.
      // Without half-float render targets it falls back to computing the field per pixel.
      const FIELD_SCALE = 2; // device px per field texel, each axis
      const hf = gl.getExtension("OES_texture_half_float");
      let fbo = null;
      if (hf && gl.getExtension("OES_texture_half_float_linear")) {
        gl.getExtension("EXT_color_buffer_half_float");
        gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
        for (const k of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER]) gl.texParameteri(gl.TEXTURE_2D, k, gl.LINEAR);
        for (const k of [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T]) gl.texParameteri(gl.TEXTURE_2D, k, gl.CLAMP_TO_EDGE);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, hf.HALF_FLOAT_OES, null);
        fbo = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, gl.getParameter(gl.TEXTURE_BINDING_2D), 0);
        if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) fbo = null;
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      }

      const common = `
        precision highp float;
        uniform vec4 u_blobs[${MAX_SLOTS}]; // x, y, r² (device px), heat 0..1
        uniform int u_count;

        // Metaball field at p, and the field-weighted heat of the wax there
        vec2 fieldAt(vec2 p) {
          float field = 0.0, hsum = 0.0;
          for (int i = 0; i < ${MAX_SLOTS}; i++) {
            if (i >= u_count) break;
            vec4 b = u_blobs[i];
            vec2 d = p - b.xy;
            float w = b.z / max(dot(d, d), 1.0);
            field += w;
            hsum += w * b.w;
          }
          return vec2(min(field, 1000.0), hsum / max(field, 0.001)); // clamped to stay finite in half floats
        }
      `;

      const fieldSource = common + `
        void main() { gl_FragColor = vec4(fieldAt(gl_FragCoord.xy * ${FIELD_SCALE}.0), 0.0, 1.0); }
      `;

      const shadeSource = common + `
        uniform sampler2D u_field;
        uniform vec2 u_fieldRes; // field texture size in device px
        uniform vec2 u_res;
        uniform float u_time;
        uniform float u_dpr;

        // Ordered 4x4 Bayer threshold in [0, 1)
        float bayer2(vec2 a) { a = floor(a); return fract(a.x * 0.5 + a.y * a.y * 0.75); }
        float bayer4(vec2 a) { return bayer2(a * 0.5) * 0.25 + bayer2(a); }

        void main() {
          vec2 uv = gl_FragCoord.xy;
          vec2 f = ${fbo ? "texture2D(u_field, uv / u_fieldRes).xy" : "fieldAt(uv)"};
          float field = f.x;

          float dist = abs(field - 0.65);
          float edge = exp(-dist * 35.0);
          float glow = exp(-dist * 14.0) * 0.3;
          float interior = smoothstep(0.63, 0.67, field);
          float depth = mix(1.3, 0.8, smoothstep(0.65, 3.0, field)); // brighter rim, darker core

          // Dithered backdrop: faint purple bloom toward the center, crushed to 2px Bayer dots
          float th = bayer4(uv / (2.0 * u_dpr));
          float bloom = 1.0 - length((uv - 0.5 * u_res) / u_res.y);
          vec3 col = mix(vec3(0.055, 0.047, 0.078), vec3(0.11, 0.07, 0.17), step(th, bloom * 0.35));
          // Lamp bulb: dithered glow rising from the bottom edge
          float heat = 1.0 - smoothstep(0.0, 1.0, uv.y / u_res.y);
          col = mix(col, vec3(0.16, 0.06, 0.22), step(th, heat * heat * heat * 0.5));
          col = mix(col, vec3(0.12, 0.06, 0.22), interior * 0.35 * depth);
          // Fast-moving wax runs hot: brighter, pinker rim that cools as it settles
          float h = clamp(f.y, 0.0, 1.0) * 0.3;
          col += vec3(0.50, 0.20, 0.85) * glow * (1.0 + h);
          col += mix(vec3(0.75, 0.40, 1.0), vec3(0.95, 0.55, 0.95), h) * edge * (1.5 + 0.5 * h);
          col *= mix(1.0, 0.9 + 0.1 * sin(u_time * 2.0), edge);
          col += (th - 0.5) * 0.02; // ordered dither instead of film grain

          // CRT glass: scanline every 4 CSS px + vignette toward the corners
          col *= 1.0 - 0.08 * step(3.0, mod(uv.y / u_dpr, 4.0));
          col *= 1.0 - 0.35 * clamp((length(uv / u_res - 0.5) * 1.4142 - 0.65) / 0.35, 0.0, 1.0);

          gl_FragColor = vec4(col, 1.0);
        }
      `;

      function program(fsSource) {
        const prog = gl.createProgram();
        for (const [type, src] of [[gl.VERTEX_SHADER, "attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }"], [gl.FRAGMENT_SHADER, fsSource]]) {
          const sh = gl.createShader(type);
          gl.shaderSource(sh, src);
          gl.compileShader(sh);
          if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(sh));
          gl.attachShader(prog, sh);
        }
        gl.bindAttribLocation(prog, 0, "p");
        gl.linkProgram(prog);
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(prog));
        const u = {};
        for (const name of ["u_blobs", "u_count", "u_fieldRes", "u_res", "u_time", "u_dpr"]) u[name] = gl.getUniformLocation(prog, name);
        return { prog, u };
      }
      const shade = program(shadeSource);
      const fieldPass = fbo && program(fieldSource);

      // Fullscreen quad
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

      const blobData = new Float32Array(MAX_SLOTS * 4);
      let fieldW = 0, fieldH = 0;

      function resize() {
        dpr = +debug.get("scale") || Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        gl.useProgram(shade.prog);
        gl.uniform2f(shade.u.u_res, canvas.width, canvas.height);
        gl.uniform1f(shade.u.u_dpr, dpr);
        if (fbo) {
          fieldW = Math.ceil(canvas.width / FIELD_SCALE);
          fieldH = Math.ceil(canvas.height / FIELD_SCALE);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, fieldW, fieldH, 0, gl.RGBA, hf.HALF_FLOAT_OES, null);
          gl.uniform2f(shade.u.u_fieldRes, fieldW * FIELD_SCALE, fieldH * FIELD_SCALE);
        }
      }
      resize();
      addEventListener("resize", resize);

      // --- Blob physics: 3 large + 5 medium = 8 blobs ---
      const ORIGINAL_COUNT = 8;
      // Scale blob radii for smaller viewports (tuned for ~900px min dimension)
      const viewScale = Math.min(1, Math.min(W, H) / 900);
      function makeBlob(rMin, rMax, x, y) {
        return {
          x, y, px: x, py: y, vx: 0, vy: 0, heat: 0, freeFlying: false,
          r: (rMin + Math.random() * (rMax - rMin)) * viewScale,
          phaseX: Math.random() * Math.PI * 2,
          phaseY: Math.random() * Math.PI * 2,
          freqX: 0.00015 + Math.random() * 0.00025,
          freqY: 0.00015 + Math.random() * 0.00025,
          buoyancy: (Math.random() - 0.5) * 0.002,
        };
      }
      // 3 large + 5 medium, starting in a ring around the center card
      const blobs = Array.from({ length: ORIGINAL_COUNT }, (_, i) => {
        const angle = (i / ORIGINAL_COUNT) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
        const dist = 80 + Math.random() * 60;
        return makeBlob(i < 3 ? 90 : 49, i < 3 ? 128 : 83, W / 2 + Math.cos(angle) * dist, H / 2 + Math.sin(angle) * dist);
      });
      const originalRadii = blobs.map(b => b.r);

      // --- Physics ---
      function updateCursor() {
        // Spring-animate cursor metaball radius
        const targetRadius = (mouseDown ? CURSOR_R_CLICK : CURSOR_R_REST) * viewScale;
        cursorRadiusVel = (cursorRadiusVel + (targetRadius - cursorRadius) * CURSOR_SPRING_K) * CURSOR_SPRING_DAMP;
        cursorRadius += cursorRadiusVel;

        if (mx === null) { cursorLive = false; return; }
        if (!cursorLive) { cur.x = trail.x = mx; cur.y = trail.y = my; cursorLive = true; }
        cur.px = cur.x; cur.py = cur.y;
        trail.px = trail.x; trail.py = trail.y;
        // Speed per physics step, so it's smooth however often the mouse reports
        const dx = mx - cur.x, dy = my - cur.y;
        mouseSpeed = Math.max(Math.sqrt(dx * dx + dy * dy), mouseSpeed * MOUSE_SPEED_DECAY);
        cur.x = mx; cur.y = my;
        trail.x += (mx - trail.x) * CURSOR_TRAIL_LAG;
        trail.y += (my - trail.y) * CURSOR_TRAIL_LAG;
      }

      function updateIdleTimeline() {
        // Idle nudges → dance → go home (seconds idle: 15, 25, 40 → dance at 50 → home ~25s later)
        if (!idleMode) {
          const idleFrames = time - lastInteractionTime;
          if (idleFrames === IDLE_NUDGE_FRAMES[0]) { showHint("hello?", 3); idleHinted = true; }
          if (idleFrames === IDLE_NUDGE_FRAMES[1]) showHint("helloooo", 3);
          if (idleFrames === IDLE_NUDGE_FRAMES[2]) showHint("anyone there?", 3);
          if (idleFrames === IDLE_DANCE_START) {
            showHint("fine, I'll entertain myself");
            idleMode = true;
            idleShapeIndex = prevIdleShapeIndex = 0;
            idleShapeSwitchTime = idleDanceStart = time;
          }
        }

        // Cycle idle shapes
        if (idleMode && time - idleShapeSwitchTime > IDLE_SHAPE_DURATION) {
          prevIdleShapeIndex = idleShapeIndex;
          idleShapeIndex = (idleShapeIndex + 1) % shapes.length;
          idleShapeSwitchTime = time;
          for (const b of blobs) { b.vx *= 0.3; b.vy *= 0.3; }
        }

        // Smoothly shrink blob radii during idle dance
        idleRadiusFactor += ((idleMode ? 0 : 1) - idleRadiusFactor) * IDLE_RADIUS_LERP;
        const idleR = IDLE_UNIFORM_R * viewScale;
        for (let k = 0; k < Math.min(ORIGINAL_COUNT, blobs.length); k++) {
          blobs[k].r = idleR + (originalRadii[k] - idleR) * idleRadiusFactor;
        }
      }

      function pop() {
        hasPopped = true;
        popFrame = time;
        blobs.forEach((b, i) => {
          const angle = (i / blobs.length) * Math.PI * 2 + (Math.random() - 0.5) * 1.5;
          const speed = 8 + Math.random() * 4;
          b.vx = Math.cos(angle) * speed;
          b.vy = Math.sin(angle) * speed;
          b.freeFlying = true;
        });
        showHint("oh no! you popped my bubble", 0);
        for (let i = 0; i < POP_BONUS_COUNT; i++) {
          const angle = (i / POP_BONUS_COUNT) * Math.PI * 2;
          const b = makeBlob(25, 35, W / 2, H / 2);
          b.vx = Math.cos(angle) * 6;
          b.vy = Math.sin(angle) * 6;
          blobs.push(b);
        }
      }

      function checkReassembled() {
        const n = Math.min(ORIGINAL_COUNT, blobs.length);
        let cx = 0, cy = 0;
        for (let i = 0; i < n; i++) { cx += blobs[i].x / n; cy += blobs[i].y / n; }
        for (let i = 0; i < n; i++) if (Math.hypot(blobs[i].x - cx, blobs[i].y - cy) > REASSEMBLE_RADIUS) return;
        if (!idleMode) {
          hasReassembled = true;
          if (!reassembleHintShown) { reassembleHintShown = true; showHint("aw, you put it back :)", 1); }
        } else if (blobs.length <= ORIGINAL_COUNT) {
          hasReassembled = true;
          if (!reassembleHintShown) { reassembleHintShown = true; showHint("ok bye", 3); }
          idleMode = false;
        }
      }

      // Soft gooey wall pushback: returns the spring force for one axis
      const wallForce = (p, size, r) => p < r ? (r - p) / r * WALL_SPRING : p > size - r ? (size - r - p) / r * WALL_SPRING : 0;

      function updateBlobs() {
        // Pop: triggers on hover near center or click
        if (!hasPopped && (mouseDown || (mx !== null && Math.hypot(mx - W / 2, my - H / 2) < POP_RADIUS))) pop();
        if (hasPopped && !hasReassembled && time - popFrame > REASSEMBLE_DELAY) checkReassembled();

        // Gradually fade extra blobs after reassembly
        if (hasReassembled) {
          for (let j = blobs.length - 1; j >= ORIGINAL_COUNT; j--) {
            if ((blobs[j].r *= BLOB_FADE_RATE) < BLOB_FADE_MIN) blobs.splice(j, 1);
          }
        }

        const escaped = hasPopped && time - popFrame > 150;
        const cx = W / 2, cy = H / 2;
        const danceSec = (time - idleDanceStart) / 60;
        const homeBlend = smoothstep01(hasPopped ? (danceSec - 25) / 5 : 0);
        const shapeFade = smoothstep01((time - idleShapeSwitchTime) / IDLE_SHAPE_BLEND);
        const shapeScale = Math.min(W, H) * 0.7;
        const prevShape = shapes[prevIdleShapeIndex], curShape = shapes[idleShapeIndex];

        // Mouse force: push until popped + escaped, then suck (click repels on desktop)
        let range = MOUSE_ATTRACT_RANGE, strength = -0.12 * (1 + mouseSpeed * 0.05);
        if (!escaped) { range = MOUSE_PUSH_RANGE; strength = 0.3; }
        else if (mouseDown && !isTouch) { range = MOUSE_REPEL_RANGE; strength = 0.7; }

        for (let i = 0; i < blobs.length; i++) {
          const b = blobs[i];

          // Idle formation steering
          if (idleMode) {
            // Fade out extra blobs during go-home
            if (homeBlend > 0 && i >= ORIGINAL_COUNT && (b.r *= BLOB_FADE_RATE_GOHOME) < BLOB_FADE_MIN) {
              blobs.splice(i--, 1);
              continue;
            }
            let tx, ty, k;
            if (i < ORIGINAL_COUNT) {
              const p = prevShape[i], q = curShape[i];
              tx = cx + (p[0] + (q[0] - p[0]) * shapeFade) * shapeScale;
              ty = cy + (p[1] + (q[1] - p[1]) * shapeFade) * shapeScale;
              k = 0.003;
            } else {
              const angle = time * 0.002 + i * 1.3, orbitR = Math.min(W, H) * 0.45;
              tx = cx + Math.cos(angle) * orbitR;
              ty = cy + Math.sin(angle) * orbitR;
              k = 0.001;
            }
            b.vx += (tx + (cx - tx) * homeBlend - b.x) * k;
            b.vy += (ty + (cy - ty) * homeBlend - b.y) * k;
          }

          // Slow sinusoidal drift + buoyancy
          b.vx += Math.sin(time * b.freqX + b.phaseX) * 0.0002;
          b.vy += Math.cos(time * b.freqY + b.phaseY) * 0.0002 + b.buoyancy;

          // Blob-blob interactions: short-range repel, long-range attract (skip free-flying)
          if (!b.freeFlying) {
            for (let j = i + 1; j < blobs.length; j++) {
              const o = blobs[j];
              if (o.freeFlying) continue;
              const dx = o.x - b.x, dy = o.y - b.y;
              const combinedR = b.r + o.r;
              const distSq = dx * dx + dy * dy;
              if (distSq > 9 * combinedR * combinedR || distSq < 1) continue;
              const dist = Math.sqrt(distSq);
              const force = dist < combinedR * 0.5
                ? -0.003 * (1 - dist / (combinedR * 0.5))
                : 0.0012 * (dist - combinedR * 0.5) / (combinedR * 2.5);
              const fx = dx / dist * force, fy = dy / dist * force;
              b.vx += fx; b.vy += fy;
              o.vx -= fx; o.vy -= fy;
            }
          }

          if (mx !== null && !b.freeFlying && !idleMode) {
            const dx = b.x - mx, dy = b.y - my;
            const dist = Math.max(Math.sqrt(dx * dx + dy * dy), 50);
            if (dist < range) {
              const taper = 1 - dist / range;
              const force = taper * taper * strength;
              b.vx += dx / dist * force;
              b.vy += dy / dist * force;
              if (strength < 0 && dist < MOUSE_PROXIMITY_DAMP) {
                const damp = 0.92 + 0.06 * (dist / MOUSE_PROXIMITY_DAMP);
                b.vx *= damp;
                b.vy *= damp;
              }
            }
          }

          const wx = wallForce(b.x, W, b.r), wy = wallForce(b.y, H, b.r);
          if (wx) b.vx = (b.vx + wx) * WALL_DAMP;
          if (wy) b.vy = (b.vy + wy) * WALL_DAMP;

          b.vx *= DAMPING;
          b.vy *= DAMPING;

          // Clamp speed (free-flying blobs get a higher clamp to reach the wall)
          const clamp = b.freeFlying ? SPEED_CLAMP_FLYING : SPEED_CLAMP;
          const speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
          if (speed > clamp) { b.vx *= clamp / speed; b.vy *= clamp / speed; }

          b.x += b.vx;
          b.y += b.vy;

          // Free-flying blobs become normal on wall contact or when they lose momentum
          if (b.freeFlying && (Math.min(speed, clamp) < SPEED_CLAMP || b.x <= b.r || b.x >= W - b.r || b.y <= b.r || b.y >= H - b.r)) {
            b.freeFlying = false;
          }

          // Allow center past edge by up to half radius (wall smoosh)
          b.x = Math.max(-b.r * 0.5, Math.min(W + b.r * 0.5, b.x));
          b.y = Math.max(-b.r * 0.5, Math.min(H + b.r * 0.5, b.y));
        }
      }

      function update() {
        time++;
        // Remember last positions (for render interpolation) and ease each blob's heat toward its speed
        for (const b of blobs) {
          b.px = b.x; b.py = b.y;
          b.heat = b.heat * 0.94 + 0.06 * Math.min(Math.sqrt(b.vx * b.vx + b.vy * b.vy) / 8, 1);
        }
        updateCursor();
        updateIdleTimeline();
        updateBlobs();
      }

      let slot = 0;
      function put(x, y, r, heat) {
        if (r <= 0 || slot >= MAX_SLOTS) return;
        const k = slot++ * 4;
        blobData[k] = x * dpr;
        blobData[k + 1] = (H - y) * dpr;
        blobData[k + 2] = r * r * dpr * dpr;
        blobData[k + 3] = heat;
      }

      // Blend between the last two physics steps so motion is smooth at any refresh rate
      const putLerp = (o, r, heat, alpha) => put(o.px + (o.x - o.px) * alpha, o.py + (o.y - o.py) * alpha, r, heat);

      function draw(alpha) {
        slot = 0;
        if (cursorLive) {
          const heat = Math.min(mouseSpeed / 60, 1);
          putLerp(cur, cursorRadius, heat, alpha);
          // Trailing cursor for natural deformation when moving
          putLerp(trail, cursorRadius * 0.55 * Math.min(mouseSpeed / 12, 1), heat, alpha);
        }
        for (let i = 0; i < blobs.length; i++) putLerp(blobs[i], blobs[i].r, blobs[i].heat, alpha);
        const blobPass = fieldPass || shade;
        gl.useProgram(blobPass.prog);
        gl.uniform1i(blobPass.u.u_count, slot);
        gl.uniform4fv(blobPass.u.u_blobs, blobData);
        if (fieldPass) {
          gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
          gl.viewport(0, 0, fieldW, fieldH);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          gl.useProgram(shade.prog);
        }
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.uniform1f(shade.u.u_time, time * 0.01);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }

      // Fixed 60 Hz physics step (same speed on 120 Hz displays), rendered every frame
      let last = performance.now(), acc = 0;
      const hud = debug.has("fps") && document.body.appendChild(Object.assign(document.createElement("pre"), { style: "position:fixed;top:8px;left:8px;margin:0;font:12px monospace;color:#c4b5fd" }));
      let hudFrames = 0, hudStart = 0, hudWorst = 0;
      requestAnimationFrame(function loop(now) {
        if (hud) {
          hudWorst = Math.max(hudWorst, now - last);
          if (++hudFrames, now - hudStart > 1000) {
            hud.textContent = `${Math.round(hudFrames * 1000 / (now - hudStart))} fps  worst ${hudWorst.toFixed(1)} ms\n${canvas.width}×${canvas.height} @ ${dpr}x  ${slot} blobs`;
            hudFrames = hudWorst = 0;
            hudStart = now;
          }
        }
        acc = Math.min(acc + now - last, 250);
        last = now;
        for (; acc >= STEP; acc -= STEP) update();
        draw(acc / STEP);
        requestAnimationFrame(loop);
      });

      // --- Return visitor memory ---
      try {
        const visits = +(localStorage.getItem("murfalo_visits") || 0) + 1;
        localStorage.setItem("murfalo_visits", visits);
        if (visits > 1) setTimeout(() => showHint(
          visits === 2 ? "oh, you're back!"
          : visits === 3 ? "you again?"
          : visits <= 5 ? "at this point we're friends"
          : visits <= 9 ? "ok you basically live here now"
          : visits < 25 ? "welcome home :)"
          : `visit #${visits}. you're dedicated`, 3), 5000);
      } catch (e) { /* localStorage unavailable */ }

    })();

    // --- PDB author search ---
    // Credited as author, or co-author with Aoki on the primary citation.
    (() => {
      const link = document.querySelector("a.pdb-link");
      const term = (attribute, value) => ({ type: "terminal", service: "text", parameters: { attribute, operator: "exact_match", value } });
      const query = { type: "group", logical_operator: "or", nodes: [
        term("audit_author.name", "Angelo, M.C."),
        { type: "group", logical_operator: "and", nodes: [
          term("rcsb_primary_citation.rcsb_authors", "Angelo, M."),
          term("rcsb_primary_citation.rcsb_authors", "Aoki, S.T."),
        ] },
      ] };
      link.dataset.url = "https://www.rcsb.org/search?request=" + encodeURIComponent(JSON.stringify({ query, return_type: "entry" }));
    })();

    // --- Clean link previews ---
    // Links with data-url show their short href in the browser's hover status bar
    // and swap in the real URL only when pressed (any click or Enter).
    document.querySelectorAll("a[data-url]").forEach(a => {
      const short = a.href, go = () => { a.href = a.dataset.url; };
      a.addEventListener("pointerdown", go);
      a.addEventListener("keydown", e => e.key === "Enter" && go());
      a.addEventListener("mouseleave", () => { a.href = short; });
    });

    // --- Email obfuscation ---
    // Address is assembled from char codes at click time so it never appears
    // as a harvestable string in the HTML source.
    document.querySelector("a.email-link").addEventListener("click", e => {
      e.preventDefault();
      location.href = "mailto:" + String.fromCharCode(115, 105, 116, 101, 64, 109, 117, 114, 102, 97, 108, 111, 46, 99, 111, 109);
    });
  </script>
</body>
